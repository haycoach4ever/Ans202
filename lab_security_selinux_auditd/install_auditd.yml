---
- name: Ensure audit logging is active
  hosts: rhel_nodes
  become: yes

  tasks:
    - name: Install audit and related tools
      dnf:
        name:
          - audit
          - policycoreutils-python-utils
        state: present

    - name: Start and enable auditd service
      systemd:
        name: auditd
        state: started
        enabled: yes
