---
- name: Partition /dev/sdb and /dev/sdc
  hosts: rhel_nodes
  become: yes

  tasks:
    - name: Create GPT partition table on /dev/sdb
      parted:
        device: /dev/sdb
        label: gpt

    - name: Create primary partition on /dev/sdb
      parted:
        device: /dev/sdb
        number: 1
        part_type: primary
        state: present
        align: optimal
        part_start: 1MiB
        part_end: 100%

    - name: Create GPT partition table on /dev/sdc
      parted:
        device: /dev/sdc
        label: gpt

    - name: Create primary partition on /dev/sdc
      parted:
        device: /dev/sdc
        number: 1
        part_type: primary
        state: present
        align: optimal
        part_start: 1MiB
        part_end: 100%
